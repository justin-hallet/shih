<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Space Harrier themed icon - larger version -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>
  
  <!-- Grid pattern (retro) -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Harrier figure (detailed) -->
  <g transform="translate(256,256)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="20" ry="25" fill="#00ff00" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Jetpack -->
    <rect x="-30" y="10" width="60" height="35" fill="#ff6b00" stroke="#ffffff" stroke-width="4" rx="8"/>
    <rect x="-25" y="15" width="50" height="25" fill="#ff8c00" rx="4"/>
    
    <!-- Jetpack flames with glow -->
    <g filter="url(#glow)">
      <ellipse cx="-20" cy="50" rx="6" ry="20" fill="#ff0000" opacity="0.9"/>
      <ellipse cx="-10" cy="55" rx="8" ry="25" fill="#ff4500" opacity="0.8"/>
      <ellipse cx="0" cy="60" rx="10" ry="30" fill="#ffff00" opacity="0.9"/>
      <ellipse cx="10" cy="55" rx="8" ry="25" fill="#ff4500" opacity="0.8"/>
      <ellipse cx="20" cy="50" rx="6" ry="20" fill="#ff0000" opacity="0.9"/>
    </g>
    
    <!-- Arms -->
    <ellipse cx="-35" cy="15" rx="8" ry="20" fill="#00ff00" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="35" cy="15" rx="8" ry="20" fill="#00ff00" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Hands/Weapons -->
    <circle cx="-40" cy="30" r="6" fill="#ffff00" stroke="#ffffff" stroke-width="2"/>
    <circle cx="40" cy="30" r="6" fill="#ffff00" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="15" fill="#ffcccb" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-5" cy="-12" r="2" fill="#000000"/> <!-- Eye -->
    <circle cx="5" cy="-12" r="2" fill="#000000"/>  <!-- Eye -->
    
    <!-- Hair/Helmet -->
    <ellipse cx="0" cy="-20" rx="18" ry="8" fill="#8b4513" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Game title -->
  <text x="256" y="100" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">SPACE</text>
  <text x="256" y="140" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">HARRIER</text>
  <text x="256" y="420" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">INFINITE HORIZONS</text>
</svg>
